simulation_metadata:
  target_replicates: 1000
  random_seed: 2026
  framework_alignment: "Main Manuscript Table 8 Baseline and Stress Scenarios"

trial_design:
  total_periods: 6
  observations_per_period: 14
  total_observations: 84
