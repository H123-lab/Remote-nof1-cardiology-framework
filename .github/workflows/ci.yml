name: Remote N-of-1 Cardiology Platform CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-platform-integrity:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Data
      uses: actions/checkout@v3

    - name: Configure Isolated Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Locked Platform Package Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Execute Automated Mathematical Verification Unit Tests
      run: |
        pytest test_pipeline.py

    - name: Run Digital Twin Simulation & Document Compilers
      run: |
        python virtual_cohort_engine.py
        python process_table_9.py
